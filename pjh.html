<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝말잇기 게임</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --error: #EF4444;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .current-word-area {
            background-color: #EEF2FF;
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #E0E7FF;
        }

        .current-word-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .target-char {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .full-word {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #E5E7EB;
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .message.system {
            align-self: center;
            background-color: #FEF3C7;
            color: #92400E;
            font-size: 0.85rem;
            border-radius: 20px;
            text-align: center;
        }

        .input-area {
            padding: 15px 20px;
            border-top: 1px solid #E5E7EB;
            background-color: white;
        }

        .input-form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        .status-msg {
            font-size: 0.8rem;
            color: var(--error);
            margin-top: 6px;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>끝말잇기 게임 🎮</h1>
        <div class="score-board">
            <span>내 점수: <strong id="user-score">0</strong></span>
            <span>컴퓨터: <strong id="bot-score">0</strong></span>
        </div>
    </div>

    <div class="current-word-area">
        <div class="current-word-title">제시어 (다음 글자)</div>
        <div class="target-char" id="target-char">시작!</div>
        <div class="full-word" id="full-word">아무 단어나 입력하여 게임을 시작하세요.</div>
    </div>

    <div class="chat-history" id="chat-history">
        <div class="message system">게임이 시작되었습니다. 2글자 이상의 한국어 단어를 입력하세요!</div>
    </div>

    <div class="input-area">
        <form class="input-form" id="game-form" onsubmit="handleSubmit(event)">
            <input type="text" id="word-input" placeholder="단어를 입력하세요" autocomplete="off" autofocus>
            <button type="submit" id="submit-btn">전송</button>
        </form>
        <div class="status-msg" id="status-msg"></div>
    </div>
</div>

<script>
    // 상태 관리
    let currentWord = "";
    let usedWords = new Set();
    let userScore = 0;
    let botScore = 0;
    let isProcessing = false;

    // 두음법칙 처리 변환표
    function getPossibleNextChars(char) {
        if (!char) return [];
        const chars = [char];
        
        // 한글 유니코드 계산
        const code = char.charCodeAt(0) - 44032;
        if (code < 0 || code > 11172) return chars; // 한글이 아님

        const initial = Math.floor(code / 588); // 초성 Index
        const medial = Math.floor((code % 588) / 28); // 중성 Index
        const final = code % 28; // 종성 Index

        // 두음법칙 규칙 적용
        // 1. '녀, 뇨, 뉴, 니' -> '여, 요, 유, 이' (초성 ㄴ -> ㅇ)
        if (initial === 2 && [2, 12, 17, 20].includes(medial)) {
            const newCode = 44032 + (11 * 588) + (medial * 28) + final;
            chars.push(String.fromCharCode(newCode));
        }
        // 2. '랴, 려, 례, 료, 류, 리' -> '야, 여, 예, 요, 유, 이' (초성 ㄹ -> ㅇ)
        else if (initial === 5 && [2, 6, 7, 12, 17, 20].includes(medial)) {
            const newCode = 44032 + (11 * 588) + (medial * 28) + final;
            chars.push(String.fromCharCode(newCode));
        }
        // 3. '라, 로, 루, 르, 래, 로, 뢰' -> '나, 노, 누, 느, 내, 노, 뇌' (초성 ㄹ -> ㄴ)
        else if (initial === 5 && [0, 8, 13, 18, 1, 11].includes(medial)) {
            const newCode = 44032 + (2 * 588) + (medial * 28) + final;
            chars.push(String.fromCharCode(newCode));
        }

        return chars;
    }

    // 우리말샘 / 국립국어원 Open API 형태의 사전 검증 API (우리말샘 API 대용 오픈 API 호출)
    async function validateWordWithAPI(word) {
        try {
            const response = await fetch(`https://ko.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`);
            const data = await response.json();
            const pages = data.query.pages;
            const pageId = Object.keys(pages)[0];
            
            // 위키낱말사전에 페이지가 존재하는지 확인 (-1은 미존재)
            return pageId !== "-1";
        } catch (e) {
            // API 네트워크 실패 시 기본 통과 처리
            return true;
        }
    }

    // 컴퓨터의 단어 검색 (위키낱말사전 검색)
    async function fetchBotWord(firstChar) {
        const possibleChars = getPossibleNextChars(firstChar);
        
        for (const char of possibleChars) {
            try {
                const response = await fetch(`https://ko.wiktionary.org/w/api.php?action=query&list=prefixsearch&pssearch=${encodeURIComponent(char)}&pslimit=20&format=json&origin=*`);
                const data = await response.json();
                const searchResults = data.query.prefixsearch;

                for (const item of searchResults) {
                    const word = item.title;
                    // 한글 단어, 2글자 이상, 미사용 단어 검증
                    if (/^[가-힣]+$/.test(word) && word.length >= 2 && !usedWords.has(word)) {
                        return word;
                    }
                }
            } catch (e) {
                console.error("API error:", e);
            }
        }
        return null;
    }

    // 화면 메시지 추가
    function addMessage(text, sender) {
        const history = document.getElementById('chat-history');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        history.appendChild(msgDiv);
        history.scrollTop = history.scrollHeight;
    }

    // 상태 메시지 표시
    function showStatus(msg) {
        document.getElementById('status-msg').innerText = msg;
    }

    // 입력 처리
    async function handleSubmit(e) {
        e.preventDefault();
        if (isProcessing) return;

        const inputEl = document.getElementById('word-input');
        const word = inputEl.value.trim();
        showStatus("");

        // 1. 기본 유효성 검사
        if (word.length < 2) {
            showStatus("두 글자 이상의 단어를 입력하세요.");
            return;
        }

        if (!/^[가-힣]+$/.test(word)) {
            showStatus("한글 단어만 입력 가능합니다.");
            return;
        }

        // 2. 끝말잇기 규칙 검사
        if (currentWord !== "") {
            const lastChar = currentWord.slice(-1);
            const validFirstChars = getPossibleNextChars(lastChar);
            const userFirstChar = word.charAt(0);

            if (!validFirstChars.includes(userFirstChar)) {
                showStatus(`'${validFirstChars.join("' 또는 '")}'(으)로 시작하는 단어야 합니다.`);
                return;
            }
        }

        // 3. 중복 단어 검사
        if (usedWords.has(word)) {
            showStatus("이미 사용된 단어입니다.");
            return;
        }

        // 처리 중 상태 변경
        isProcessing = true;
        document.getElementById('submit-btn').disabled = true;

        // 4. 단어 존재 여부 확인 (API 검증)
        showStatus("단어 확인 중...");
        const isValid = await validateWordWithAPI(word);

        if (!isValid) {
            showStatus("사전에 등록되지 않은 단어입니다.");
            isProcessing = false;
            document.getElementById('submit-btn').disabled = false;
            return;
        }

        // 사용한 단어로 등록 및 화면 업데이트
        usedWords.add(word);
        currentWord = word;
        userScore += word.length * 10;
        document.getElementById('user-score').innerText = userScore;
        
        addMessage(word, 'user');
        inputEl.value = '';
        
        const nextChar = word.slice(-1);
        const nextCharsPossible = getPossibleNextChars(nextChar);
        document.getElementById('target-char').innerText = nextCharsPossible.join('/') ;
        document.getElementById('full-word').innerText = `현재 단어: ${word}`;
        showStatus("컴퓨터가 단어를 생각하고 있습니다...");

        // 5. 컴퓨터 턴
        setTimeout(async () => {
            const botWord = await fetchBotWord(nextChar);

            if (!botWord) {
                addMessage("컴퓨터가 단어를 찾지 못했습니다. 당신의 승리입니다! 🎉", 'system');
                showStatus("게임 종료! 플레이어 승리");
                document.getElementById('target-char').innerText = "승리!";
            } else {
                usedWords.add(botWord);
                currentWord = botWord;
                botScore += botWord.length * 10;
                document.getElementById('bot-score').innerText = botScore;

                addMessage(botWord, 'bot');
                const botNextChar = botWord.slice(-1);
                const botNextCharsPossible = getPossibleNextChars(botNextChar);
                document.getElementById('target-char').innerText = botNextCharsPossible.join('/');
                document.getElementById('full-word').innerText = `현재 단어: ${botWord}`;
                showStatus("");
            }

            isProcessing = false;
            document.getElementById('submit-btn').disabled = false;
            inputEl.focus();
        }, 800);
    }
</script>
</body>
</html>
